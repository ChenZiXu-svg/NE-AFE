[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ne-afe"
version = "2.0.0"
description = "Domain-guided automated feature engineering for variable renewable energy forecasting"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "NE-AFE contributors"}]
dependencies = ["numpy>=1.26,<3", "pandas>=2.2,<3", "scikit-learn>=1.6,<2"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
experiments = ["matplotlib>=3.8,<4", "pyarrow>=18", "scipy>=1.13,<2", "torch>=2.5,<3", "xgboost==3.0.5", "psutil>=5.9"]
baselines = ["featuretools>=1.31,<2", "tsfresh>=0.20,<1", "optuna>=4,<5", "openpyxl>=3.1", "tqdm>=4.66", "jupyterlab>=4,<5"]

[tool.setuptools.packages.find]
where = ["."]
include = ["neafe_v2*", "experiments*", "examples*"]
