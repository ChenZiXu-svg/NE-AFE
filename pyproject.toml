[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ne-afe"
version = "2.0.1"
description = "Automated feature engineering for variable renewable energy forecasting"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = ["numpy>=1.26,<3", "pandas>=2.2,<3", "scikit-learn>=1.6,<2"]

[project.optional-dependencies]
models = ["torch>=2.5,<3", "xgboost==3.0.5"]

[tool.setuptools.packages.find]
include = ["neafe_v2*"]
